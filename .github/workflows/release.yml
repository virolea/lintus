# Builds lintus for every platform when a version tag is pushed, attaches the
# binaries to a GitHub release, and publishes the crates to crates.io.
#
# To release:
#   1. On main, set the version in Cargo.toml (and in crates/jev/Cargo.toml if
#      the client changed), and move the CHANGELOG.md entries under a heading
#      for the version: "## [0.3.0] - 2026-10-01".
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# crates.io uses trusted publishing (OIDC), so no token is stored in the
# repository. It can only be set up for a crate that exists, so publish
# jev-api and lintus once by hand with `cargo publish`, then add this
# repository and workflow as a trusted publisher in each crate's settings.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the tag matches the version in Cargo.toml
        run: |
          version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lintus") | .version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the lintus version in Cargo.toml ($version)" >&2
            exit 1
          fi

  build:
    needs: check
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl), so they run on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="lintus-$TARGET"
          mkdir "$name"
          cp README.md LICENSE.txt CHANGELOG.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGET/release/lintus.exe" "$name/"
            (cd "$name" && 7z a -tzip "../$name.zip" . >/dev/null)
            archive="$name.zip"
            sha256sum "$archive" > "$archive.sha256"
          else
            cp "target/$TARGET/release/lintus" "$name/"
            tar -czf "$name.tar.gz" -C "$name" .
            archive="$name.tar.gz"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lintus-${{ matrix.target }}.tar.gz*
            lintus-${{ matrix.target }}.zip*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cp install.sh dist/
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*

  crates:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish jev-api, unless this version is already out
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jev-api") | .version')
          if curl -sf "https://crates.io/api/v1/crates/jev-api/$version" > /dev/null; then
            echo "jev-api $version is already on crates.io"
          else
            cargo publish --locked -p jev-api
          fi
      - name: Publish lintus
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p lintus
