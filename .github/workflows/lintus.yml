# Lintus linting itself, built from this checkout. It also checks, on every pull
# request, that a real call to the Jev API works. Skipped on forks without the secret.
name: Lintus

on:
  pull_request:

permissions:
  contents: read

jobs:
  lintus:
    runs-on: ubuntu-latest
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: env.JEV_API_KEY != ''
      - uses: Swatinem/rust-cache@v2
        if: env.JEV_API_KEY != ''
      - name: Run lintus from this checkout
        if: env.JEV_API_KEY != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo run --release --locked -- --format github --diff "origin/$BASE_REF"
