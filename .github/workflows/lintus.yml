# Lintus linting itself, built from this checkout and run through the action in this
# checkout, so a pull request exercises both. Offenses are located on the changed lines and
# posted as review comments. It also checks, on every pull request, that a real call to the
# Jev API works. Skipped on forks without the secret.
name: Lintus

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lintus:
    runs-on: ubuntu-latest
    env:
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}   # line numbers must match the PR diff
      - uses: dtolnay/rust-toolchain@stable
        if: env.JEV_API_KEY != ''
      - uses: Swatinem/rust-cache@v2
        if: env.JEV_API_KEY != ''
      - name: Build lintus from this checkout
        if: env.JEV_API_KEY != ''
        run: |
          cargo build --release --locked
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - name: Run lintus
        if: env.JEV_API_KEY != ''
        uses: ./
        with:
          jev-api-key: ${{ secrets.JEV_API_KEY }}
          version: installed
          locate: true
          comment: true
