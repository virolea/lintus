# Lintus lints itself with these rules. See README.md for the format.

paths:
  - "src/**/*.rs"
  - "crates/*/src/**/*.rs"

rules:
  no_debugging_leftovers:
    description: Debugging statements must not be committed.
    question: Does this file contain leftover debugging code, such as dbg!, or a println!/eprintln! used to inspect a value?
    criteria:
      "true": A dbg! call, or a print statement that dumps an internal value rather than telling the user something, is present.
      "false": Any output is deliberate program behaviour, or there is none.

  errors_are_actionable:
    description: Error messages must tell the user what was wrong and what to do about it.
    question: Does this file build an error message that would leave a user unsure of what went wrong or how to fix it?
    criteria:
      "true": At least one message is vague, such as "invalid" or "failed", with no detail.
      "false": Every message names the problem, or the file builds no error messages.

  modules_are_documented:
    description: Each module should open with a comment describing its responsibility.
    question: Does this file start without a module-level doc comment (//!) explaining what the module is for?
    criteria:
      "true": The file does not open with a //! comment, or that comment does not say what the module does.
      "false": The file opens with a //! comment describing its purpose.
