name: Lintus
description: Lint a repository against the plain-language rules in its .lintus.yml, using the Jev model.
author: Vincent Rolea
branding:
  icon: check-circle
  color: purple

inputs:
  jev-api-key:
    description: API key for the Typesafe Jev model. Store it as a repository secret.
    required: true
  base:
    description: >-
      Git ref to diff against; only files changed since it are linted. Defaults to the
      pull request base branch on pull_request events, and to linting every file otherwise.
      Pass "none" to always lint every file. Requires `fetch-depth: 0` on actions/checkout.
    required: false
    default: ""
  args:
    description: Extra arguments for the lintus command, for example "--jobs 8".
    required: false
    default: ""
  version:
    description: >-
      Version of lintus to install, such as 0.3.0. Defaults to the version of the action
      itself when it is used at a version tag (virolea/lintus@v0.3.0), and to the latest
      release otherwise.
    required: false
    default: ""
  ruby-version:
    description: No longer used; lintus is a single binary and needs no Ruby.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install lintus
      shell: bash
      env:
        LINTUS_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        version="$LINTUS_VERSION"
        if [ -z "$version" ]; then
          case "$ACTION_REF" in
            v[0-9]*) version="$ACTION_REF" ;;
            *) version="latest" ;;
          esac
        fi
        case "$version" in
          latest) base="https://github.com/virolea/lintus/releases/latest/download" ;;
          v*) base="https://github.com/virolea/lintus/releases/download/$version" ;;
          *) base="https://github.com/virolea/lintus/releases/download/v$version" ;;
        esac

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) archive="lintus-x86_64-unknown-linux-musl.tar.gz" ;;
          Linux-ARM64) archive="lintus-aarch64-unknown-linux-musl.tar.gz" ;;
          macOS-X64) archive="lintus-x86_64-apple-darwin.tar.gz" ;;
          macOS-ARM64) archive="lintus-aarch64-apple-darwin.tar.gz" ;;
          Windows-X64) archive="lintus-x86_64-pc-windows-msvc.zip" ;;
          *) echo "::error title=lintus::No lintus binary for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
        esac

        dir="$RUNNER_TEMP/lintus"
        mkdir -p "$dir"
        cd "$dir"
        if ! curl -fsSL "$base/$archive" -o "$archive" || ! curl -fsSL "$base/$archive.sha256" -o "$archive.sha256"; then
          echo "::error title=lintus::Could not download $base/$archive. Releases before 0.3.0 have no binaries."
          exit 1
        fi
        if command -v sha256sum > /dev/null; then actual=$(sha256sum "$archive" | cut -d ' ' -f 1); else actual=$(shasum -a 256 "$archive" | cut -d ' ' -f 1); fi
        if [ "$actual" != "$(cut -d ' ' -f 1 "$archive.sha256")" ]; then
          echo "::error title=lintus::The checksum of $archive does not match"
          exit 1
        fi
        case "$archive" in
          *.zip) unzip -q "$archive" ;;
          *) tar -xzf "$archive" ;;
        esac
        echo "$dir" >> "$GITHUB_PATH"

    - name: Run lintus
      shell: bash
      env:
        JEV_API_KEY: ${{ inputs.jev-api-key }}
        LINTUS_BASE: ${{ inputs.base }}
        LINTUS_ARGS: ${{ inputs.args }}
        PR_BASE_REF: ${{ github.base_ref }}
      run: |
        lintus --version
        base="$LINTUS_BASE"
        if [ -z "$base" ] && [ -n "$PR_BASE_REF" ]; then
          base="origin/$PR_BASE_REF"
        fi

        if [ -n "$base" ] && [ "$base" != "none" ]; then
          git fetch --no-tags origin "${base#origin/}" >/dev/null 2>&1 || true
          lintus --format github --diff "$base" $LINTUS_ARGS
        else
          lintus --format github $LINTUS_ARGS
        fi
